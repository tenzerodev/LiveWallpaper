name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v1.1.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app (Apple Silicon + Intel)
        run: UNIVERSAL=1 VERSION="${{ inputs.version || 'v1.2.0' }}" bash build.sh
      - name: Zip
        run: ditto -c -k --keepParent LiveWallpaper.app LiveWallpaper-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LiveWallpaper-macOS
          path: LiveWallpaper-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build single-file .exe
        run: dotnet publish windows/LiveWallpaper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath LiveWallpaper-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LiveWallpaper-Windows
          path: LiveWallpaper-Windows.zip

  release:
    needs: [macos, windows]
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: LiveWallpaper ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
