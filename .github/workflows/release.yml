name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app (Apple Silicon + Intel)
        run: UNIVERSAL=1 bash build.sh

      - name: Zip
        run: ditto -c -k --keepParent LiveWallpaper.app LiveWallpaper-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveWallpaper-macOS
          path: LiveWallpaper-macOS.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LiveWallpaper-macOS.zip
          generate_release_notes: true
